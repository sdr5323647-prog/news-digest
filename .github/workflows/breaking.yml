name: Breaking news watcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/breaking.py
      - name: Weather (IMS, official and free)
        run: python scripts/weather.py
        continue-on-error: true
      - name: Commit if the alert or weather changed
        run: |
          if [ -n "$(git status --porcelain data/breaking.json data/weather.json)" ]; then
            git config user.name "tamzit-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/breaking.json data/weather.json
            git commit -m "Breaking/weather update"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
