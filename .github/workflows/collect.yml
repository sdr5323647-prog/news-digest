name: Collect headlines

# Every 3 hours: read public RSS feeds and cluster articles into candidate events
# (data/candidates/YYYY-MM-DD.json). No AI, no API keys. Free on public repositories.
# RSS only keeps recent items, so collecting during the day gives the evening run the whole day.
on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/collect.py
      - name: Commit candidates
        run: |
          if [ -n "$(git status --porcelain data/candidates)" ]; then
            git config user.name "tamzit-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/candidates
            git commit -m "Collect headlines"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
