name: Tests

# Runs on every push. Free on public repositories. No secrets, no paid services.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Engine tests (learning, ranking, sections)
        run: node --test tests/engine.test.js
      - name: Pipeline tests (clustering, verification rules, no paid deps)
        run: python -m unittest discover -s tests -v
      - name: Every published digest passes the editorial rules
        run: python scripts/validate.py
